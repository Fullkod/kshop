<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:10px;min-width:0;color:var(--fg);font-family:var(--sf-body)">
  <div style="position:relative;aspect-ratio:4/5;border-radius:var(--sf-radius);overflow:hidden;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 8%,var(--surface)) 0 12px,var(--surface) 12px 24px);box-shadow:var(--sf-shadow)">
    <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 11px/1 'JetBrains Mono',monospace;color:var(--muted);letter-spacing:.04em;opacity:{{ imgOpacity }}">{{ p.label }}</span>
    <div style="position:absolute;left:10px;top:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px">
      <sc-if value="{{ p.off }}" hint-placeholder-val="{{ false }}"><span style="background:var(--sale);color:var(--sale-fg);font:700 12px/1 var(--sf-body);padding:6px 8px;border-radius:var(--sf-radius-sm)">-{{ p.off }}%</span></sc-if>
      <sc-if value="{{ p.badge }}" hint-placeholder-val="{{ false }}"><span style="background:var(--secondary);color:var(--secondary-fg);font:600 12px/1 var(--sf-body);padding:6px 8px;border-radius:var(--sf-radius-sm)">{{ p.badge }}</span></sc-if>
      <sc-if value="{{ p.sold }}" hint-placeholder-val="{{ false }}"><span style="background:var(--bg);color:var(--fg);font:600 12px/1 var(--sf-body);padding:6px 8px;border-radius:var(--sf-radius-sm);border:1px solid var(--line)">Agotado</span></sc-if>
    </div>
    <button aria-label="Favorito" style="position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:999px;border:none;background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer">
      <dc-import name="Icon" n="heart" style="width:18px;height:18px" hint-size="18px,18px"></dc-import>
    </button>
    <sc-if value="{{ canAdd }}" hint-placeholder-val="{{ true }}">
      <button aria-label="Añadir al carrito" style="position:absolute;right:10px;bottom:10px;height:40px;padding:0 14px 0 12px;border-radius:var(--sf-btn-radius);border:none;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;gap:6px;font:600 13px/1 var(--sf-body);cursor:pointer;box-shadow:var(--sf-shadow)" style-hover="background:var(--accent-hover)">
        <dc-import name="Icon" n="plus" style="width:18px;height:18px" hint-size="18px,18px"></dc-import>
        <sc-if value="{{ showAddLabel }}" hint-placeholder-val="{{ true }}"><span>Añadir</span></sc-if>
      </button>
    </sc-if>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;padding:0 2px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:14px">
      <span style="font:500 11px/1.2 var(--sf-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">{{ p.brand }}</span>
      <div style="display:flex;gap:4px">
        <sc-for list="{{ p.colors }}" as="c" hint-placeholder-count="0"><span style="width:12px;height:12px;border-radius:999px;background:{{ c }};box-shadow:0 0 0 1px var(--line),inset 0 0 0 1px rgb(0 0 0/.08)"></span></sc-for>
      </div>
    </div>
    <h3 style="margin:0;font:500 15px/1.3 var(--sf-body);color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{ p.name }}</h3>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px">
      <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px">
        <sc-if value="{{ p.from }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:var(--muted)">Desde</span></sc-if>
        <span style="font:700 16px/1.2 var(--sf-heading);color:var(--fg)">{{ p.price }}</span>
        <sc-if value="{{ p.compare }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:var(--muted);text-decoration:line-through">{{ p.compare }}</span></sc-if>
      </div>
      <a href="#" aria-label="Pedir por WhatsApp" title="Pedir por WhatsApp" style="flex:none;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--wa)" style-hover="background:var(--surface)">
        <dc-import name="Icon" n="message-circle" style="width:17px;height:17px" hint-size="17px,17px"></dc-import>
      </a>
    </div>
  </div>
</div>
</sc-if>
<sc-if value="{{ isRow }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;gap:12px;align-items:center;min-width:0;color:var(--fg);font-family:var(--sf-body)">
  <div style="position:relative;flex:none;width:76px;aspect-ratio:4/5;border-radius:var(--sf-radius-sm);overflow:hidden;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 8%,var(--surface)) 0 8px,var(--surface) 8px 16px)">
    <sc-if value="{{ p.off }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:4px;top:4px;background:var(--sale);color:var(--sale-fg);font:700 10px/1 var(--sf-body);padding:4px 5px;border-radius:var(--sf-radius-sm)">-{{ p.off }}%</span></sc-if>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1">
    <span style="font:500 11px/1.2 var(--sf-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">{{ p.brand }}</span>
    <span style="font:500 14px/1.3 var(--sf-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.name }}</span>
    <div style="display:flex;align-items:baseline;gap:8px">
      <span style="font:700 15px/1.2 var(--sf-heading);color:var(--fg)">{{ p.price }}</span>
      <sc-if value="{{ p.compare }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:var(--muted);text-decoration:line-through">{{ p.compare }}</span></sc-if>
    </div>
  </div>
  <button aria-label="Añadir" style="flex:none;width:40px;height:40px;border-radius:var(--sf-btn-radius);border:none;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;cursor:pointer">
    <dc-import name="Icon" n="plus" style="width:18px;height:18px" hint-size="18px,18px"></dc-import>
  </button>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:440},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{name,brand,price,compare?,off?,badge?,sold?,from?,colors?,label}&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grid&quot;,&quot;row&quot;],&quot;default&quot;:&quot;grid&quot;,&quot;tsType&quot;:&quot;'grid'|'row'&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.p || { name: "Vestido de lino Ñandú", brand: "Kaya", price: "1 500 CUP", label: "foto · producto", colors: ["#C2410C", "#1F2937"], badge: "Nuevo" };
    const layout = this.props.layout || "grid";
    return {
      p, isGrid: layout === "grid", isRow: layout === "row",
      canAdd: !p.sold, showAddLabel: !this.props.compact,
      imgOpacity: p.sold ? 0.45 : 1,
    };
  }
}
</script>
</body>
</html>
