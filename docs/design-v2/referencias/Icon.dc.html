<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script></helmet>{{ svg }}
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:24,&quot;height&quot;:24},&quot;n&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;heart&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    if (window.lucide) return;
    this.poll = setInterval(() => { if (window.lucide) { clearInterval(this.poll); this.forceUpdate(); } }, 100);
  }
  componentWillUnmount() { clearInterval(this.poll); }
  renderVals() {
    const name = (this.props.n || "circle").split("-").map((w) => w[0].toUpperCase() + w.slice(1)).join("");
    let node = window.lucide && window.lucide.icons && window.lucide.icons[name];
    if (node && node[0] === "svg") node = node[2];
    const kids = (node || []).map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }));
    return {
      svg: React.createElement("svg", {
        viewBox: "0 0 24 24", width: "100%", height: "100%", fill: this.props.f ? "currentColor" : "none", stroke: "currentColor",
        strokeWidth: this.props.w || 2, strokeLinecap: "round", strokeLinejoin: "round", style: { display: "block" }, "aria-hidden": true,
      }, kids),
    };
  }
}
</script>
</body>
</html>
