<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;gap:8px">
  <sc-for list="{{ timer }}" as="t" hint-placeholder-count="4">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:clamp(62px,6cqw,76px);padding:12px 0 10px;border-radius:var(--sf-radius);background:var(--bg);box-shadow:var(--sf-shadow)"><span style="font:800 clamp(24px,2.4cqw,30px)/1 var(--sf-heading);color:var(--sale);font-variant-numeric:tabular-nums">{{ t.v }}</span><span style="font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">{{ t.l }}</span></div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:90}}">
class Component extends DCLogic {
  state = { now: Date.now() };
  end = Date.now() + ((2 * 24 + 7) * 3600 + 42 * 60 + 18) * 1000;
  componentDidMount() { this.t = setInterval(() => this.setState({ now: Date.now() }), 1000); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const s = Math.max(0, Math.floor((this.end - this.state.now) / 1000));
    const pad = (n) => String(n).padStart(2, "0");
    return { timer: [{ v: pad(Math.floor(s / 86400)), l: "días" }, { v: pad(Math.floor((s % 86400) / 3600)), l: "horas" }, { v: pad(Math.floor((s % 3600) / 60)), l: "min" }, { v: pad(s % 60), l: "seg" }] };
  }
}
</script>
</body>
</html>
